title: Vivaldi
description: >
  Браузер от независимых разработчиков, ранее работавших над Opera. Предлагает
  огромное разнообразие функций и персонализации, лишён генеративного ИИ.
  Проприетарный, основан на Chromium. Компания зарабатывает на спонсированных
  ярлыках, но не продаёт личные данные пользователей.
