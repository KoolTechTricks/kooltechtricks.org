title: Grayjay
description: >
  Универсальное приложение для просмотра видео и прямых эфиров на стриминговых
  платформах. Официально поддерживаются YouTube, Odysee, PeerTube, Twitch, Kick,
  Patreon, SoundCloud и другие. Есть возможность устанавливать сторонние плагины.
