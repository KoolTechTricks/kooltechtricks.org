description: >
  Браузер с хорошей защитой от отслеживания по умолчанию без ущерба для удобства
  использования. С открытым исходным кодом, основан на модифицированной версии
  Chromium. Имеет интеграции с криптовалютами, ИИ и собственными сервисами.
