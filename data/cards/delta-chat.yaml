title: Delta Chat
icon: delta-chat.svg
description: >
  Простой в использовании приватный мессенджер со сквозным шифрованием. Не
  требует номер телефона и прочие персональные данные. Поддерживаются многие
  функции популярных мессенджеров, включая звонки, каналы, боты,
  мини-приложения. Имеет открытую инфраструктуру и децентрализованную сеть на
  основе стандартных интернет-протоколов. Защищён от нежелательных сообщений и
  спама на архитектурном уровне. Некоммерческий проект, полностью бесплатный и
  без рекламы.
homepage: https://delta.chat/ru
