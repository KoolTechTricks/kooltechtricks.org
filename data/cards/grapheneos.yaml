title: GrapheneOS
description: >
  Мобильная операционная система на основе Android Open Source Project,
  сосредоточенная на улучшение безопасности и приватности без ущерба удобству
  использования. Предустановлен минимум необходимых приложений, сервисы Google
  опциональны и устанавливаются в изолированном режиме.
