# https://docs.kooltechtricks.org/contributing/cards/
title: SponsorBlock
description: >
  Расширение для браузера, которое позволяет пропускать раздражающие сегменты в
  видео на YouTube, такие как реклама, напоминания о взаимодействии, заставки.
  Пользователи отправляют отрезки, соответствующие этим сегментам, и формируют
  общедоступную базу данных.
homepage: https://sponsor.ajay.app
userDocs: https://wiki.sponsor.ajay.app/w/Guidelines
extras:
  owner: '[Ajay Ramachandran](https://ajay.app)'
  initialRelease: 2019-07-13
