seeAlso:
  - title: GrapheneOS
    link: /software/grapheneos
    description: >
      Операционная система на базе Android Open Source Project, сосредоточенная
      на улучшение безопасности и приватности без ущерба удобству использования.
      Добавляет возможность отозвать разрешение на интернет, позволяет выдавать
      приложениям доступ к индивидуальным файлам и контактам, расширяет
      пользователей.
